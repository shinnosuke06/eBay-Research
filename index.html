<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" href="./ebay_icon.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffd1dc">
    <meta name="apple-mobile-web-app-title" content="ebay管理">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>eBayリサーチ＆利益計算ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body { overscroll-behavior-y: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col overflow-hidden relative">

    <!-- モーダル類（省略せずにそのまま保持してください） -->
    <div id="high-price-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50 p-4"><div class="bg-white p-6 rounded-2xl w-full max-w-sm"><h3 class="font-bold">警告</h3><button onclick="closeModal()">OK</button></div></div>
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50 p-4"><div class="bg-white p-6 rounded-2xl w-full max-w-lg"><h3 class="font-bold mb-4">設定</h3><input type="url" id="settings-gas-url" class="w-full border p-2 mb-4"><div class="flex justify-end gap-2"><button onclick="closeSettingsModal()">キャンセル</button><button onclick="saveSettings()" class="bg-blue-600 text-white px-4 py-2 rounded">保存</button></div></div></div>

    <!-- ヘッダー -->
    <header class="bg-blue-600 text-white p-2 md:p-4 shadow-md shrink-0 z-40 relative">
        <div class="flex justify-between items-center max-w-7xl mx-auto">
            <div class="flex items-center gap-2">
                <button onclick="toggleSidebar()" class="md:hidden p-1 -ml-1"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
                <h1 class="text-base md:text-xl font-bold">GPA Tool</h1>
            </div>
            <div class="flex items-center gap-2 text-xs md:text-sm">
                <div class="flex items-center gap-1 bg-blue-700/50 p-1 rounded-lg">
                    <span class="text-blue-100">為替:</span>
                    <input type="number" id="global-rate" value="150" class="w-12 px-1 py-0.5 text-black rounded text-right text-sm"> 
                    <span class="text-blue-100">円/$</span>
                </div>
                <button onclick="openSettingsModal()" class="p-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden relative max-w-7xl mx-auto w-full">
        <!-- 左サイドバー (検索・リスト) -->
        <section id="sidebar" class="absolute inset-y-0 left-0 w-4/5 bg-white border-r border-slate-200 flex flex-col h-full z-30 transform -translate-x-full md:relative md:translate-x-0 md:w-1/3 md:max-w-sm transition-transform duration-300">
            <div class="flex border-b bg-slate-50 shrink-0">
                <button id="tab-search" class="flex-1 py-3 text-sm font-bold text-blue-600 border-b-2 border-blue-600" onclick="switchSidebarTab('search')">🔍 検索</button>
                <button id="tab-saved" class="flex-1 py-3 text-sm font-bold text-slate-500" onclick="switchSidebarTab('saved')">📌 追跡 (<span id="saved-count">0</span>)</button>
            </div>
            
            <div id="control-panel" class="p-3 border-b bg-slate-50 shrink-0">
                <div class="flex gap-2 mb-2">
                    <input type="text" id="search-input" placeholder="キーワード (例: Pokemon)" class="flex-1 border rounded px-2 py-1.5 text-sm" onkeypress="if(event.key === 'Enter') executeSearch()">
                    <button id="btn-search" onclick="executeSearch()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm font-medium">検索</button>
                </div>
                <!-- ★追加: 検索条件フィルタ -->
                <div class="grid grid-cols-2 gap-2 mb-2 bg-white p-2 rounded border border-slate-200 shadow-sm">
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-0.5">商品状態</label>
                        <select id="search-status" class="w-full border rounded px-1 py-1 text-xs">
                            <option value="sold">売却済 (Sold)</option>
                            <option value="active">出品中 (Active)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-0.5">発送元</label>
                        <select id="search-location" class="w-full border rounded px-1 py-1 text-xs">
                            <option value="jp">日本 (Japan) のみ</option>
                            <option value="all">すべて</option>
                        </select>
                    </div>
                    <div class="col-span-2 flex items-center gap-2 mt-1">
                        <label class="text-[10px] text-slate-500 whitespace-nowrap">最低価格(円)</label>
                        <input type="number" id="search-min-price" placeholder="例: 10000" class="flex-1 border rounded px-2 py-1 text-xs">
                    </div>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-2 bg-slate-50" id="item-list"></div>
        </section>

        <!-- 右メインコンテンツ (計算画面) -->
        <section class="flex-1 overflow-y-auto bg-slate-100 p-3 md:p-6 w-full" id="main-content">
            <div id="calculator-panel" class="max-w-5xl mx-auto space-y-4 hidden pb-20 md:pb-0">
                <div class="bg-white p-4 rounded-xl shadow-sm border">
                    <div class="flex justify-between items-start gap-2 mb-2">
                        <h2 id="selected-title" class="text-base md:text-lg font-bold text-slate-800 leading-tight">商品名</h2>
                        <a id="selected-link" href="#" target="_blank" class="shrink-0 bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-1 rounded border border-blue-200">eBayで見る</a>
                    </div>
                    <div class="flex flex-wrap gap-x-4 gap-y-1 text-sm">
                        <div>
                            <span class="text-slate-500 text-xs">eBay価格:</span>
                            <span id="selected-price" class="font-bold text-blue-600">$0.00</span>
                        </div>
                        <div>
                            <span class="text-slate-500 text-xs">過去90日の総販売数:</span>
                            <!-- ★ここに総販売数が表示されます -->
                            <span id="selected-sold" class="font-bold text-red-600 text-base">0件</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div class="space-y-4">
                        <div class="bg-white p-4 rounded-xl shadow-sm border">
                            <h3 class="font-bold text-slate-700 text-sm mb-3">国内仕入れリサーチ</h3>
                            <div class="grid grid-cols-1 gap-2 mb-3">
                                <div class="p-2 bg-emerald-50 rounded border border-emerald-100 text-center">
                                    <div class="text-[10px] text-emerald-800 mb-0.5">目標仕入れ上限額（損益分岐点）</div>
                                    <div class="text-base font-bold text-emerald-700" id="break-even-point">¥0 以下</div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="openSearch('amazon')" class="w-full bg-slate-800 text-white text-xs py-2 rounded">Amazon検索</button>
                                <button onclick="openSearch('mercari')" class="w-full bg-red-500 text-white text-xs py-2 rounded">メルカリ検索</button>
                            </div>
                        </div>

                        <div class="bg-white p-4 rounded-xl shadow-sm border">
                            <h3 class="font-bold text-slate-700 text-sm mb-3">シミュレーション入力</h3>
                            <div class="space-y-3">
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-xs text-slate-500 mb-1">販売価格(USD)</label>
                                        <input type="number" id="calc-price-usd" class="w-full border rounded px-2 py-1.5 text-sm" oninput="calculate()">
                                    </div>
                                    <div>
                                        <label class="block text-xs text-slate-500 mb-1">実仕入価格(円)</label>
                                        <input type="number" id="calc-cost-jpy" value="0" class="w-full border rounded px-2 py-1.5 text-sm" oninput="calculate()">
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-xs text-slate-500 mb-1">重量(g)</label>
                                        <input type="number" id="calc-weight" value="500" class="w-full border rounded px-2 py-1.5 text-sm" oninput="calculate()">
                                    </div>
                                    <div>
                                        <label class="block text-xs text-slate-500 mb-1">手数料率(%)</label>
                                        <input type="number" id="calc-fee-percent" value="17" class="w-full border rounded px-2 py-1.5 text-sm" oninput="calculate()">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-500 mb-1">配送サービス</label>
                                    <select id="calc-shipping" class="w-full border rounded px-2 py-1.5 text-sm" onchange="calculate()">
                                        <option value="epacket">日本郵便 (小型包装物/eパケ相当)</option>
                                        <option value="ems">日本郵便 (EMS)</option>
                                        <option value="fedex">FedEx/DHL</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 計算結果パネル -->
                    <div class="bg-slate-800 text-white p-4 rounded-xl shadow-lg h-fit lg:sticky lg:top-4">
                        <h3 class="text-sm font-bold mb-3 border-b border-slate-600 pb-2">計算結果</h3>
                        <div class="space-y-2 text-sm">
                            <div class="flex justify-between"><span class="text-slate-400">総売上額</span><span id="res-sales">¥0</span></div>
                            <div class="flex justify-between"><span class="text-slate-400">仕入原価</span><span id="res-cost" class="text-red-300">- ¥0</span></div>
                            <div class="flex justify-between"><span class="text-slate-400">手数料</span><span id="res-fee" class="text-red-300">- ¥0</span></div>
                            <div class="flex justify-between"><span class="text-slate-400">国際送料</span><span id="res-ship" class="text-red-300">- ¥0</span></div>
                            
                            <div class="bg-slate-900 p-3 rounded-lg mt-3 text-center">
                                <div class="text-xs text-slate-400 mb-1">見込み純利益</div>
                                <div id="res-profit" class="text-3xl font-black text-emerald-400">¥0</div>
                                <div class="text-xs text-slate-400 mt-1">利益率: <span id="res-margin" class="text-white">0%</span></div>
                            </div>
                        </div>
                        <button id="btn-save" onclick="saveToTracker()" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-bold shadow-md">
                            スプレッドシートに記録
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-400 p-6 text-center">
                <p>左側のメニューからキーワード検索を行ってください</p>
            </div>
        </section>
    </main>

    <script>
        let GAS_API_URL = localStorage.getItem('gasApiUrl') || "";
        let currentSidebarTab = 'search'; 
        let currentItem = null;
        let searchItems = [];
        let savedItems = [];

        // ★追加・修正: 検索実行関数
        async function executeSearch() {
            const keyword = document.getElementById('search-input').value.trim();
            if(!keyword) { alert("キーワードを入力してください。"); return; }
            if(!GAS_API_URL) { alert("右上の設定(歯車)からGASのURLを登録してください。"); return; }
            
            const status = document.getElementById('search-status').value;
            const location = document.getElementById('search-location').value;
            const minPriceJpy = parseFloat(document.getElementById('search-min-price').value) || 0;
            const rate = parseFloat(document.getElementById('global-rate').value) || 150;
            const minPriceUsd = minPriceJpy > 0 ? (minPriceJpy / rate).toFixed(2) : 0;
            
            const btn = document.getElementById('btn-search');
            btn.innerHTML = "検索中..."; btn.disabled = true;
            document.getElementById('item-list').innerHTML = `<div class="text-center py-6 text-xs text-slate-400">eBayからデータを取得中...<br>数秒お待ち下さい</div>`;
            
            try {
                const query = `action=search&keyword=${encodeURIComponent(keyword)}&status=${status}&location=${location}&minPriceUsd=${minPriceUsd}`;
                const res = await fetch(`${GAS_API_URL}?${query}`);
                const data = await res.json();
                
                if(data.success) {
                    const totalSold = data.data.totalEntries || 0; // ★過去90日の総ヒット数を取得
                    searchItems = data.data.items.map(item => ({
                        ...item,
                        estCost: 0,
                        weight: 500,
                        soldCount: totalSold // ★アイテムデータに持たせる
                    }));
                    if(currentSidebarTab !== 'search') switchSidebarTab('search');
                    renderList();
                } else {
                    alert("検索エラー: " + data.error);
                }
            } catch(e) {
                alert("通信エラーが発生しました");
            } finally {
                btn.innerHTML = "検索"; btn.disabled = false;
            }
        }

        // リスト描画と計算処理
        function renderList() {
            const listEl = document.getElementById('item-list');
            listEl.innerHTML = '';
            if (searchItems.length === 0) { listEl.innerHTML = `<div class="text-center text-slate-500 py-6 text-xs">データがありません</div>`; return; }

            searchItems.forEach(item => {
                const itemJson = encodeURIComponent(JSON.stringify(item));
                const thumbHtml = item.thumb ? `<img src="${item.thumb}" class="w-full h-full object-cover">` : `<span class="text-slate-400 text-[9px] font-bold">NoImg</span>`;
                const html = `
                <div class="border border-slate-200 bg-white rounded-lg p-2.5 hover:shadow-md cursor-pointer mb-2" onclick="selectItem('${itemJson}')">
                    <div class="flex gap-2">
                        <div class="w-12 h-12 bg-slate-100 rounded border flex-shrink-0 overflow-hidden">${thumbHtml}</div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-medium text-xs text-slate-800 truncate">${item.title}</h3>
                            <div class="flex justify-between items-end mt-1">
                                <span class="font-bold text-blue-600">$${item.priceUsd.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                </div>`;
                listEl.insertAdjacentHTML('beforeend', html);
            });
        }

        function selectItem(encodedItemJson) {
            const item = JSON.parse(decodeURIComponent(encodedItemJson)); currentItem = item;
            document.getElementById('empty-state').classList.add('hidden'); document.getElementById('calculator-panel').classList.remove('hidden');
            document.getElementById('selected-title').textContent = item.title;
            document.getElementById('selected-link').href = item.itemUrl || "#";
            document.getElementById('selected-price').textContent = "$" + item.priceUsd.toFixed(2);
            document.getElementById('selected-sold').textContent = item.soldCount + "件"; // ★ここで90日販売数を表示
            document.getElementById('calc-price-usd').value = item.priceUsd;
            document.getElementById('calc-cost-jpy').value = ""; // リサーチ前は空にする
            calculate();
        }

        function calculate() {
            const rate = parseFloat(document.getElementById('global-rate').value) || 150;
            const priceUsd = parseFloat(document.getElementById('calc-price-usd').value) || 0;
            const costJpy = parseFloat(document.getElementById('calc-cost-jpy').value) || 0;
            const weight = parseFloat(document.getElementById('calc-weight').value) || 500;
            const shippingType = document.getElementById('calc-shipping').value;
            const feePercent = parseFloat(document.getElementById('calc-fee-percent').value) || 17;

            const salesJpy = Math.floor(priceUsd * rate);
            const feeJpy = Math.floor(salesJpy * (feePercent / 100));
            let shippingJpy = (shippingType === 'epacket') ? 900 + Math.floor(weight / 100) * 150 : (shippingType === 'ems') ? 2000 + Math.floor(weight / 100) * 200 : 2300 + Math.floor(weight / 100) * 100;
            
            // ★損益分岐点の計算
            const breakEven = salesJpy - feeJpy - shippingJpy;
            document.getElementById('break-even-point').textContent = breakEven > 0 ? "¥" + breakEven.toLocaleString('ja-JP') + " 以下" : "利益不可";

            const profit = breakEven - costJpy;

            const format = (num) => "¥" + num.toLocaleString('ja-JP');
            document.getElementById('res-sales').textContent = format(salesJpy); 
            document.getElementById('res-cost').textContent = "- " + format(costJpy);
            document.getElementById('res-fee').textContent = "- " + format(feeJpy);
            document.getElementById('res-ship').textContent = "- " + format(shippingJpy);
            
            const profitEl = document.getElementById('res-profit'); 
            profitEl.textContent = format(profit);
            profitEl.className = `text-3xl font-black ${profit < 0 ? 'text-red-500' : 'text-emerald-400'}`;
            document.getElementById('res-margin').textContent = (salesJpy > 0 ? (profit / salesJpy) * 100 : 0).toFixed(1) + "%";
        }

        function openSearch(platform) {
            if(!currentItem) return;
            const keywords = currentItem.title.split(' ').slice(0, 3).join('+');
            const url = platform === 'amazon' ? `https://www.amazon.co.jp/s?k=${keywords}` : `https://jp.mercari.com/search?keyword=${keywords}`;
            window.open(url, '_blank');
        }

        async function saveToTracker() {
            if (!currentItem || !GAS_API_URL) return;
            const btn = document.getElementById('btn-save'); btn.innerHTML = '保存中...'; btn.disabled = true;
            const payloadData = { id: currentItem.id, title: currentItem.title, priceUsd: parseFloat(document.getElementById('calc-price-usd').value), estCost: parseFloat(document.getElementById('calc-cost-jpy').value) || 0, weight: parseFloat(document.getElementById('calc-weight').value), updatedAt: new Date().toLocaleString('ja-JP') };
            try {
                const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ target: "tracker", payload: payloadData }) });
                const data = await res.json();
                if(data.success) { btn.innerHTML = '✓ 保存完了'; setTimeout(() => btn.innerHTML = 'スプレッドシートに記録', 2000); }
            } catch(e) { alert("保存エラー"); } finally { btn.disabled = false; }
        }

        // その他UI用関数
        function switchSidebarTab(tab) { currentSidebarTab = tab; /* UI切り替え処理(略) */ }
        function toggleSidebar() {}
        function openSettingsModal() { document.getElementById('settings-gas-url').value = GAS_API_URL; document.getElementById('settings-modal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settings-modal').classList.add('hidden'); }
        function saveSettings() { GAS_API_URL = document.getElementById('settings-gas-url').value; localStorage.setItem('gasApiUrl', GAS_API_URL); closeSettingsModal(); }
        function closeModal() { document.getElementById('high-price-modal').classList.add('hidden'); }
    </script>
</body>
</html>
